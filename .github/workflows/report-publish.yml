name: Report the publish

# Writes the outcome of a publish into the sheet's settings tab, where the
# editor's page reads it.
#
# The Apps Script asks GitHub to rebuild and answers straight away — it
# cannot know how the build ended, because the build happens after it has
# answered. This runs when the build is finished and writes `ok` or `failed`
# into the sheet, so the editor is told what actually happened rather than
# being told a rebuild was asked for.
#
# It is a workflow of its own on purpose: a problem in the reporting must
# never be able to stop the site from being published. The sync workflow is
# untouched by this one, and the publish workflow listens only for the sync.

on:
  workflow_run:
    workflows: ["Sync the works content"]
    types: [completed]

permissions:
  contents: read

jobs:
  report:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - name: Write the outcome into the sheet
        env:
          # The service-account key. It is a secret: it never enters the
          # repository and never reaches a browser.
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          CMS_SPREADSHEET_ID: ${{ secrets.CMS_SPREADSHEET_ID }}
          # The words the editor's page looks for. A run that was cancelled
          # or failed is a failure as far as the editor is concerned.
          PUBLISH_STATUS: ${{ github.event.workflow_run.conclusion == 'success' && 'ok' || 'failed' }}
          # When this build started. A publish asked for after this moment
          # has taken over, and this build's answer is no longer the one the
          # editor is waiting for.
          PUBLISH_RUN_AT: ${{ github.event.workflow_run.created_at }}
        run: node tools/cms/report-publish.mjs
