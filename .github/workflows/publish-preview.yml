name: Publish the preview site

# Builds the preview site and publishes it to the gh-pages branch, which is
# what GitHub Pages serves for this repository.
#
# The site is a design preview, not the live agency site: every photograph in
# it is generated mock-up artwork. See docs/LAUNCH_CHECKLIST.md section 0.

on:
  push:
    branches: [main]
  # The CMS's publish path. The sync workflow commits with the repository's
  # own token, and GitHub does not raise a `push` event for a push made
  # with that token — so the sync's completion is what starts this
  # workflow, and the commit it made is already on `main` by then.
  workflow_run:
    workflows: ["Sync the works content"]
    types: [completed]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    # A failed sync must not publish. The sync itself writes nothing when
    # the sheet is broken, so the site would be republished unchanged — but
    # the run should say so rather than look like a successful publish.
    if: >-
      github.event_name != 'workflow_run' ||
      github.event.workflow_run.conclusion == 'success'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Verify the build
        # The screens: the app compiles, every route renders in every
        # language, the copy clears the banned-word lists, the compiled case
        # content is complete, and the sitemap is written.
        #
        # This step was missing until the CMS work — a commit carrying a
        # banned word or a broken route used to reach the published site
        # without a check. It closes that, for every commit and not only for
        # the ones the CMS makes.
        run: npm run verify

      - name: Build the preview site
        # Assembles the app at the Pages root, the mock-up screen gallery
        # under review/, and the preview note under preview/. The app is built
        # with the base path baked in, because a GitHub Pages project site is
        # served from /<repo>/ rather than the domain root.
        run: python3 tools/build-pages-site.py

      - name: Publish to the gh-pages branch
        run: |
          cd docs/pages-site
          git init -q
          git checkout -q -B gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish preview site"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
