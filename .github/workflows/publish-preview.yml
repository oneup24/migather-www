name: Publish the preview site

# Builds the preview site and publishes it to the gh-pages branch, which is
# what GitHub Pages serves for this repository.
#
# The site is a design preview, not the live agency site: every photograph in
# it is generated mock-up artwork. See docs/LAUNCH_CHECKLIST.md section 0.

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - run: npm ci

      - name: Build the preview site
        # Assembles the landing page, the app under site/, and the mock-up
        # screen gallery under review/. The app is built with the base path
        # baked in, because a GitHub Pages project site is served from
        # /<repo>/ rather than the domain root.
        run: python3 tools/build-pages-site.py

      - name: Publish to the gh-pages branch
        run: |
          cd docs/pages-site
          git init -q
          git checkout -q -B gh-pages
          git add -A
          git -c user.name="github-actions[bot]" \
              -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
              commit -q -m "Publish preview site"
          git push -q --force \
            "https://x-access-token:${{ secrets.GITHUB_TOKEN }}@github.com/${{ github.repository }}.git" \
            gh-pages
