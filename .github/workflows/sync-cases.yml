name: Sync the works content

# Pulls the works content out of the Google Sheet, validates it, compiles it
# into the repository, and commits it.
#
# The trigger is the CMS: when an editor presses "Save & publish" in the
# Apps Script form, it fires a `repository_dispatch` of this type. The
# workflow can also be run by hand from the Actions tab.
#
# The build never depends on Google. If the sheet is malformed, the sync
# fails and nothing is committed — the site keeps serving the last good
# content, and the editor sees the failure in the sync output.

on:
  repository_dispatch:
    types: [sync-cases]
  workflow_dispatch:

permissions:
  contents: write

concurrency:
  # One sync at a time. Two editors saving at once would otherwise race for
  # the same commit.
  group: sync-cases
  cancel-in-progress: false

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      # Pillow resizes the images the editor uploads. The repository has no
      # npm dependencies and this is the only one it needs.
      - run: pip install pillow

      - name: Pull, validate and compile the cases
        env:
          # The service-account key. It is a secret: it never enters the
          # repository and never reaches a browser.
          GCP_SERVICE_ACCOUNT_JSON: ${{ secrets.GCP_SERVICE_ACCOUNT_JSON }}
          CMS_SPREADSHEET_ID: ${{ secrets.CMS_SPREADSHEET_ID }}
          CMS_DRIVE_FOLDER_ID: ${{ secrets.CMS_DRIVE_FOLDER_ID }}
        run: node tools/cms/sync-cases.mjs

      - name: Screen the copy
        # The 中国广告法 restricted terms and Migather's own banned claim
        # words. A case that carries one does not get committed, so it
        # cannot be published.
        run: node scripts/check-copy.mjs

      - name: Check the compiled content
        # Every published case has an image, a source, and alt text in all
        # three languages.
        run: node scripts/check-content.mjs

      - name: Rebuild the sitemap
        # The sitemap lists the published cases, so it has to move with them.
        run: node scripts/build-sitemap.mjs

      - name: Commit the content
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add content public/media/cases public/sitemap.xml
          if git diff --cached --quiet; then
            echo "The content has not changed — nothing to commit."
          else
            git commit -m "Update the works content from the sheet"
            git push origin HEAD:main
            echo "Committed. The publish workflow will deploy it."
          fi
